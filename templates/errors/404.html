{% extends "base.html" %}
{% block title %} Страница не найдена {% endblock %}
{% block content %}
    <div class="content-panel text-center">
        <span class="section-kicker">Ошибка 404</span>
        <h1 class="mb-3">Страница не найдена</h1>
        <p class="section-lead mb-4">Запрошенная страница отсутствует или была перемещена. Используйте навигацию сайта для перехода в нужный раздел.</p>
        <a href="{{ url_for('main.home') }}" class="btn btn-primary px-4">Вернуться на главную</a>
    </div>
{% endblock %}
