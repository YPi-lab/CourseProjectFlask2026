{% extends "admin/base_admin.html" %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Штатные должности</h2>
        <a href="{{ url_for('admin.add_position') }}" class="btn btn-primary">Создать должность</a>
    </div>
    <div class="card shadow-sm">
        <table class="table align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>Название</th>
                <th>Отдел</th>
                <th class="text-center">Сотрудников</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            {% for pos in positions %}
                <tr>
                    <td class="fw-bold">{{ pos.title }}</td>
                    <td>📁 {{ pos.department.name }}</td>
                    <td class="text-center"><span class="badge bg-secondary">{{ pos.employees.count() }}</span></td>
                    <td class="text-end">
                        <div class="btn-group">
                            <a href="{{ url_for('admin.edit_position', pos_id=pos.id) }}"
                               class="btn btn-sm btn-outline-primary">
                                Редактировать
                            </a>
                            <form action="{{ url_for('admin.delete_position', pos_id=pos.id) }}" method="POST"
                                  class="d-inline" onsubmit="return confirm('Удалить должность?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    Удалить
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
