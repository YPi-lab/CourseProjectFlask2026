{% extends "base.html" %}
{% block content %}
    <div class="content-panel">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <h2 class="mb-0">Пользователи сайта</h2>
            <span class="badge rounded-pill border text-secondary-emphasis bg-body-tertiary px-3 py-2">
                {{ users|length }}
            </span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Логин</th>
                    <th>Роль</th>
                    <th class="text-end">Действия</th>
                </tr>
                </thead>
                <tbody>
                {% for user in users %}
                    <tr>
                        <td><strong>{{ user.username }}</strong></td>
                        <td>
                            {% if user.is_admin %}
                                <span class="badge bg-primary">Администратор</span>
                            {% else %}
                                <span class="badge bg-secondary">Пользователь</span>
                            {% endif %}
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex flex-wrap justify-content-end gap-2">
                                <form action="{{ url_for('admin.toggle_admin', user_id=user.id) }}" method="POST"
                                      class="d-inline">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <button type="submit" class="btn btn-sm {{ 'btn-outline-warning' if user.is_admin else 'btn-outline-success' }}">
                                        {{ 'Снять админа' if user.is_admin else 'Сделать админом' }}
                                    </button>
                                </form>
                                <form action="{{ url_for('admin.delete_user', user_id=user.id) }}" method="POST"
                                      class="d-inline" onsubmit="return confirm('Удалить пользователя и его данные?')">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
