{% extends "admin/base_admin.html" %}

{% block content %}
    <h2 class="mb-4 text-dark">Общая информация</h2>
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-4 h-100 admin-stat-card admin-stat-card--dept">
                <p class="mb-2 text-uppercase small admin-stat-label">Всего отделов</p>
                <h3 class="fw-bold mb-0">{{ stats.departments_count }}</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-4 h-100 admin-stat-card admin-stat-card--staff">
                <p class="mb-2 text-uppercase small admin-stat-label">Всего сотрудников</p>
                <h3 class="fw-bold mb-0">{{ stats.employee_count }}</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-4 h-100 admin-stat-card admin-stat-card--active">
                <p class="mb-2 text-uppercase small admin-stat-label">Активных в штате</p>
                <h3 class="fw-bold mb-0">{{ stats.active_count }}</h3>
            </div>
        </div>
    </div>
{% endblock %}
